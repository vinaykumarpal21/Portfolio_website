<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Notes Manager | Vinay Kumar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notes.css">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Header & Navbar -->
    <header id="mainHeader">
        <nav class="navbar">
            <a href="index.html#home" class="logo">V<span>k</span> Notes</a>
            <div class="nav-container-right">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html#home"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="index.html#projects"><i class="fas fa-arrow-left"></i> Back to Projects</a></li>
                </ul>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Open Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="container">
        
        <div class="page-header">
            <h1>Advanced <span>Notes Manager</span></h1>
        </div>

        <div class="notes-grid">
            
            <!-- Left: Add / Edit Note Form -->
            <div class="card-box glass hover-lift">
                <h2 id="formHeading"><i class="fas fa-pen-nib"></i> Create New Note</h2>
                <form id="noteForm">
                    <input type="hidden" id="noteId">
                    <div class="form-group">
                        <label for="noteTitleInput">Note Title</label>
                        <input type="text" id="noteTitleInput" class="form-control" required placeholder="e.g. Project Roadmap">
                    </div>
                    <div class="form-group">
                        <label for="noteCategoryInput">Category</label>
                        <select id="noteCategoryInput" class="form-control" required>
                            <option value="General">General</option>
                            <option value="Development">Development</option>
                            <option value="SAP ABAP">SAP ABAP Cloud</option>
                            <option value="Ideas">Ideas & To-Do</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="noteContentInput">Note Content</label>
                        <textarea id="noteContentInput" class="form-control" required placeholder="Write your notes here..."></textarea>
                    </div>
                    <button type="submit" id="saveBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Save Note</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;" onclick="resetForm()"><i class="fas fa-times"></i> Cancel Edit</button>
                </form>
            </div>

            <!-- Right: Search, Filter & Notes Grid List -->
            <div class="card-box glass hover-lift">
                <h2><i class="fas fa-clipboard-list"></i> My Notes Vault</h2>
                
                <div class="notes-toolbar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search notes by title or content...">
                    </div>
                </div>

                <div class="notes-container" id="notesContainer">
                    <!-- Dynamic Note Cards injected here -->
                </div>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="footer-glass">
        <div class="footer-bottom">
            <p>&copy; 2026 <strong>Vinay Kumar Pal</strong>. All Rights Reserved.</p>
            <span style="opacity: 0.7; font-size: 0.8rem;">Fully Interactive CRUD Operations with LocalStorage</span>
        </div>
    </footer>

    <script src="notes.js"></script>
</body>
</html>
